<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roaring Lions</title>
    <!-- The lion emblem the lead supplied (art/favicon/favicon.png is the
         1254px source; these are sips-derived copies). PNG only: every
         browser this app targets reads a PNG icon, and an .ico would be a
         third copy of the same pixels. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%ui/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%ui/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%ui/favicon-180.png" />
    <!-- The display face is on screen before anything else is: the wordmark on
         the menu, the mission title card on the way in. Fetching it with the
         document rather than after the first stylesheet parse keeps the title
         from swapping face under the player. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/big-shoulders-display-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The body face, for the same reason: the HUD's top strip paints on the
         first frame of a mission, and a strip that reflows from a fallback
         stack to Barlow does it in front of a player who is already reading
         it. 400 only — 600 is numerals inside already-laid-out fields, so it
         can arrive with the stylesheet. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/barlow-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* The --rl-* palette is injected above this block by the lions-palette
         Vite plugin, so the ground colour is a palette value from the first
         paint — before any module has run. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--rl-shadow-1);
        color: var(--rl-limestone-0);
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
