  <rect width="1200" height="1180" fill="#14150F"/>
  <text x="24" y="36" fill="#D9C7A7" font-size="18">MOCK - GH-1096 Roaring Lion insignia. Hand-drawn SVG, NOT a render. Palette hexes only. Not final art.</text>
  <text x="24" y="60" fill="#8C7659" font-size="13">Front-facing head, bilaterally symmetric by construction (each outline is one half, mirrored),</text>
  <text x="24" y="78" fill="#8C7659" font-size="13">so both flanks read the same without mirroring the texture.</text>
  <text x="24" y="100" fill="#D9C7A7" font-size="15">A. The canonical emblem, two states of one SDF texture (256 x 256, two channels)</text>
  <rect x="24" y="114" width="280" height="280" fill="#4E5433"/>
  <use xlink:href="#lionSil" transform="translate(44,134) scale(1.2)" fill="#E6D8BE"/>
  <text x="24" y="414" fill="#D9C7A7" font-size="13">silhouette (R)</text>
  <text x="24" y="432" fill="#8C7659" font-size="12">below ~11 px: a clean roundel</text>
  <rect x="324" y="114" width="280" height="280" fill="#4E5433"/>
  <use xlink:href="#lionFull" transform="translate(344,134) scale(1.2)" fill="#E6D8BE"/>
  <text x="324" y="414" fill="#D9C7A7" font-size="13">full (R minus G)</text>
  <text x="324" y="432" fill="#8C7659" font-size="12">from ~15 px: the lion</text>
  <rect x="624" y="114" width="280" height="280" fill="#4E5433"/>
  <use xlink:href="#lionFull" transform="translate(644,134) scale(1.2)" fill="#C3C7C4"/>
  <text x="624" y="414" fill="#D9C7A7" font-size="13">full, gunmetal.0</text>
  <text x="624" y="432" fill="#8C7659" font-size="12">colour alternative</text>
  <text x="930" y="140" fill="#8C7659" font-size="12">paint  limestone.1 #E6D8BE</text>
  <text x="930" y="158" fill="#8C7659" font-size="12">alt    gunmetal.0  #C3C7C4</text>
  <text x="930" y="176" fill="#8C7659" font-size="12">ground olive.2 #4E5433</text>
  <text x="930" y="194" fill="#8C7659" font-size="12">(stand-in for the bake;</text>
  <text x="930" y="212" fill="#8C7659" font-size="12"> the Lavi bake median is</text>
  <text x="930" y="230" fill="#8C7659" font-size="12"> darker, about #544F41)</text>
  <text x="930" y="266" fill="#8C7659" font-size="12">Mane: 18 locks, two layers.</text>
  <text x="930" y="284" fill="#8C7659" font-size="12">Face: a 5% gap from the mane.</text>
  <text x="930" y="302" fill="#8C7659" font-size="12">Roar: open jaw, four fangs.</text>
  <text x="930" y="320" fill="#8C7659" font-size="12">Smallest cut-out or gap:</text>
  <text x="930" y="338" fill="#8C7659" font-size="12"> 2.5% of the diameter (5 of 200).</text>
  <text x="24" y="480" fill="#D9C7A7" font-size="15">B. Screen-size ladder (emblem diameter in CSS px). Top: full detail at every size. Bottom: the proposed LOD.</text>
