  <text x="512" y="650" fill="#8C7659" font-size="11">48</text>
  <text x="24" y="676" fill="#8C7659" font-size="12">Proposed: nothing under 5 px; the roundel fades in over 5 to 7.5 px; the lion's cut-outs fade in over 11 to 15 px.</text>
  <text x="24" y="694" fill="#8C7659" font-size="12">Measured per fragment on the emblem's SHORTER screen axis (fwidth of its own coordinate), so the battlefield,</text>
  <text x="24" y="712" fill="#8C7659" font-size="12">the garage turntable and every yaw behave alike. The browser rasteriser stands in for the SDF here.</text>
  <text x="24" y="760" fill="#D9C7A7" font-size="15">C. Pilot placement, the Lavi's flank (mesh-local metres, X forward, Y up). Boxes from the GLB.</text>
