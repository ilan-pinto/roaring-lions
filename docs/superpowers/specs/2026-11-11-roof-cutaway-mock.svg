<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="sans-serif" font-size="13">
  <!-- GH-1225 mock: a 2-storey house in section (1 tile = 60 px; 1 t = 3 m). Left: Option A, the vertical cylinder.
       Right: Option B, the view-line cylinder along the fixed 30-degree camera ray. Grey = drawn, dashed = cut away. -->
  <rect width="900" height="380" fill="#f4efe4"/>
  <text x="20" y="24" font-weight="bold">Option A (recommended): vertical cylinder, R 1.25 t, cut at 0.4 t, 0.5 t slope band</text>
  <text x="470" y="24" font-weight="bold">Option B: view-line cylinder, R 0.9 t, along the 30° camera ray</text>
  <!-- ground lines -->
  <line x1="20" y1="320" x2="440" y2="320" stroke="#6e7449" stroke-width="2"/>
  <line x1="470" y1="320" x2="890" y2="320" stroke="#6e7449" stroke-width="2"/>
  <!-- A: house 4 t wide (240 px), 2 storeys of 1 t (60 px) + roof 0.4 t -->
  <rect x="100" y="176" width="240" height="144" fill="none" stroke="#999" stroke-dasharray="5 4"/>
  <!-- A: what stays: walls to 0.4 t (24 px) inside the cylinder, sloping back to full height across the band -->
  <polygon points="100,176 100,320 340,320 340,176 310,176 280,296 160,296 130,176" fill="#c8b494" stroke="#555"/>
  <line x1="160" y1="296" x2="280" y2="296" stroke="#e6d8be" stroke-width="3"/>
  <text x="166" y="290" fill="#333">section cap 0.03 t</text>
  <!-- unit -->
  <rect x="214" y="284" width="12" height="36" fill="#2f6fd9"/>
  <text x="196" y="340">garrison / selected unit</text>
  <!-- radius marks -->
  <line x1="220" y1="150" x2="295" y2="150" stroke="#b03030"/><text x="232" y="144" fill="#b03030">R = 1.25 t</text>
  <line x1="295" y1="160" x2="325" y2="160" stroke="#b03030" stroke-dasharray="3 3"/><text x="296" y="172" fill="#b03030" font-size="11">W 0.5</text>
  <text x="350" y="300" fill="#333">0.4 t (1.2 m)</text>
  <!-- B: same house -->
  <rect x="550" y="176" width="240" height="144" fill="none" stroke="#999" stroke-dasharray="5 4"/>
  <!-- B: camera ray from the unit up-left at 30 deg (camera at the viewer's side, here drawn to the right/up) -->
  <polygon points="550,176 550,320 790,320 790,250 760,250 700,320 676,320 790,200 790,176" fill="#c8b494" stroke="#555"/>
  <rect x="664" y="284" width="12" height="36" fill="#2f6fd9"/>
  <line x1="670" y1="302" x2="880" y2="181" stroke="#b03030" stroke-dasharray="6 4"/>
  <text x="742" y="164" fill="#b03030">to the camera (30°)</text>
  <text x="560" y="350" fill="#333">B removes only what lies between the unit and the camera:</text>
  <text x="560" y="366" fill="#333">more building kept, but a slanted cut that reads as a slot.</text>
  <text x="30" y="366" fill="#333">A reads as a floor plan around the unit; 1 cut shape for selection and garrison.</text>
</svg>
