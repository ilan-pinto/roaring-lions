# The ONLY way a stored visual baseline changes on a CI runner.
#
# Manual dispatch only, with a required `reason` that is written into
# `manifest.json` and printed on every future mismatch. The result is
# COMMITTED STRAIGHT TO `main` -- the project lead's call on 2026-09-02:
# "instead of PR merge to main and push".
#
# What that trades away, stated plainly so nobody re-derives it as a bug: the
# earlier version opened a pull request so a human saw the PNG before it became
# the reference. Nothing looks at the picture now. A wrong baseline landed here
# silently disarms the visual gate for everything it would otherwise catch, and
# the only thing standing between a bad capture and `main` is whoever typed the
# reason. Keep the reason honest; it is the whole audit trail.
#
# Two jobs this workflow does that a local `pnpm golden-baseline:bless` cannot:
#
#   1. It is where `linux-x64-swiftshader` -- the environment CI actually judges
#      in -- gets its baseline. A baseline is keyed to its capture environment
#      because a shared one is measurably worse (see `baseline.ts`'s `envKey`),
#      and the macOS baseline committed alongside it is NOT a substitute.
#   2. It leaves the reason in `manifest.json`, where the compare run prints it
#      on every future mismatch.
#
# Run this the first time after `ci.yml`'s `visual` job warns "No visual
# baseline for this runner", and again whenever a renderer change is MEANT to
# change the picture.


name: visual-baseline-bless

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the picture changed (goes into manifest.json and every future mismatch message)'
        required: true
        type: string
      scenario:
        description: 'Optional comma-separated scenario ids; blank re-blesses all of them'
        required: false
        type: string

jobs:
  bless:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium

      - name: Capture a new baseline on this runner
        env:
          REASON: ${{ inputs.reason }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          ARGS=(--port=5175 --out-dir=visual-baseline-output "--reason=$REASON")
          if [ -n "${SCENARIO}" ]; then ARGS+=("--scenario=${SCENARIO}"); fi
          pnpm golden-baseline:bless -- "${ARGS[@]}"

      - name: Upload the captures the bless was taken from
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-bless-captures
          path: visual-baseline-output
          if-no-files-found: ignore
          retention-days: 14

      # An explicit path list, never `git add -A`: this job must not sweep up a
      # build artifact or anything else the capture left in the tree.
      - name: Commit the new baseline to main
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # `git status --porcelain`, NOT `git diff --quiet`, and the difference
          # was this workflow's one blocking bug. `git diff` reports only
          # TRACKED changes. The single most important run of this job is the
          # FIRST one on a new runner, which writes a brand-new environment
          # directory (`tools/golden-baselines/linux-x64-swiftshader/`) whose
          # every file is untracked -- so `git diff --quiet` exited 0, the step
          # printed "Baseline unchanged" and returned having done nothing.
          #
          # It made the whole gate a no-op: no Linux baseline meant ci.yml's
          # `visual` job exited 3 forever, warned, and stayed green -- a gate
          # reporting success while judging nothing, which is the exact failure
          # the three-vs-three rebuild exists to end.
          #
          # `-uall` lists files rather than just the directory, so the log names
          # what is about to be committed. Nothing under this path is gitignored
          # (checked); if that ever changes, this guard goes quiet again.
          CHANGES="$(git status --porcelain --untracked-files=all -- tools/golden-baselines)"
          if [ -z "$CHANGES" ]; then
            echo "::notice title=Baseline unchanged::The capture matched the stored baseline byte for byte. Nothing to commit."
            exit 0
          fi
          echo "Baseline files being committed to main:"
          echo "$CHANGES"

          # The captured PNGs are the only thing worth keeping out of this
          # checkout. Park them outside the work tree, because the next step
          # moves HEAD to main and the workflow may have been dispatched on any
          # ref -- as it was for the first Linux bless, which ran on
          # `feat/three-renderer` because main still held the broken code.
          STASH="$(mktemp -d)"
          cp -R tools/golden-baselines/. "$STASH/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry once: a push to main races anything else landing between the
          # fetch and the push, and a lost baseline would be silent.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p tools/golden-baselines
            cp -R "$STASH/." tools/golden-baselines/
            git add -- tools/golden-baselines
            if git diff --cached --quiet; then
              echo "::notice title=Baseline unchanged::Already on main byte for byte."
              exit 0
            fi
            git commit -m "chore(visual): re-bless the golden baseline

          $REASON

          Captured by .github/workflows/visual-baseline-bless.yml on this runner,
          at ${GITHUB_SHA}. Every future run of the visual gate is judged against
          exactly these pixels."
            if git push origin main; then
              echo "::notice title=Baseline committed::Pushed to main on attempt $attempt."
              {
                echo "### Baseline committed to \`main\`"
                echo ""
                echo "**Reason given:** $REASON"
                echo ""
                echo "Captured on \`ubuntu-latest\` at \`${GITHUB_SHA::7}\`. Files:"
                echo ""
                echo '```'
                echo "$CHANGES"
                echo '```'
                echo ""
                echo "Every future run of \`pnpm golden-baseline\` is judged against exactly these"
                echo "pixels. If the change was not intended, revert this commit and fix the renderer."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning title=Push rejected::main moved under us; retrying ($attempt of 3)."
          done

          echo "::error title=Baseline not committed::Three pushes to main were rejected."
          exit 1
