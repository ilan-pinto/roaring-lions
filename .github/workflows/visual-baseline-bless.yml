# The ONLY way a stored visual baseline changes on a CI runner.
#
# Manual dispatch only, a required `reason`, and the result arrives as a PULL
# REQUEST rather than a push -- so somebody looks at the picture before it
# becomes what every future run is judged against. GitHub renders a committed
# PNG's before/after side by side in the Files-changed tab, which is the whole
# point of storing full-resolution captures rather than a hash.
#
# Two jobs this workflow does that a local `pnpm golden-baseline:bless` cannot:
#
#   1. It is where `linux-x64-swiftshader` -- the environment CI actually judges
#      in -- gets its baseline. A baseline is keyed to its capture environment
#      because a shared one is measurably worse (see `baseline.ts`'s `envKey`),
#      and the macOS baseline committed alongside it is NOT a substitute.
#   2. It leaves the reason in `manifest.json`, where the compare run prints it
#      on every future mismatch.
#
# Run this the first time after `ci.yml`'s `visual` job warns "No visual
# baseline for this runner", and again whenever a renderer change is MEANT to
# change the picture.

name: visual-baseline-bless

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the picture changed (goes into manifest.json and every future mismatch message)'
        required: true
        type: string
      scenario:
        description: 'Optional comma-separated scenario ids; blank re-blesses all of them'
        required: false
        type: string

jobs:
  bless:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium

      - name: Capture a new baseline on this runner
        env:
          REASON: ${{ inputs.reason }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          ARGS=(--port=5175 --out-dir=visual-baseline-output "--reason=$REASON")
          if [ -n "${SCENARIO}" ]; then ARGS+=("--scenario=${SCENARIO}"); fi
          pnpm golden-baseline:bless -- "${ARGS[@]}"

      - name: Upload the captures the bless was taken from
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-bless-captures
          path: visual-baseline-output
          if-no-files-found: ignore
          retention-days: 14

      # An explicit path list, never `git add -A`: this job must not sweep up a
      # build artifact or anything else the capture left in the tree.
      - name: Open a pull request with the new baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # `git status --porcelain`, NOT `git diff --quiet`, and the difference
          # was the whole workflow's one blocking bug. `git diff` reports only
          # TRACKED changes. The single most important run of this job is the
          # FIRST one on a new runner, which writes a brand-new environment
          # directory (`tools/golden-baselines/linux-x64-swiftshader/`) whose
          # every file is untracked -- so `git diff --quiet` exited 0, the step
          # printed "Baseline unchanged" and returned without opening a PR.
          # Reproduced in this repo: a fresh env dir gives `git diff --quiet`
          # exit 0 while `git status --porcelain -uall` lists both files.
          #
          # It made the whole gate a no-op: no Linux baseline meant ci.yml's
          # `visual` job exited 3 forever, warned, and stayed green -- a gate
          # reporting success while judging nothing, which is the exact failure
          # the three-vs-three rebuild exists to end.
          #
          # `-uall` lists files rather than just the directory, so the log names
          # what is about to be committed. Nothing under this path is gitignored
          # (checked); if that ever changes, this guard goes quiet again.
          CHANGES="$(git status --porcelain --untracked-files=all -- tools/golden-baselines)"
          if [ -z "$CHANGES" ]; then
            echo "::notice title=Baseline unchanged::The capture matched the stored baseline byte for byte. Nothing to review."
            exit 0
          fi
          echo "Baseline files to review:"
          echo "$CHANGES"
          BRANCH="visual-baseline/${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- tools/golden-baselines
          git commit -m "chore(visual): re-bless the golden baseline

          $REASON

          Captured by .github/workflows/visual-baseline-bless.yml on this runner,
          at ${GITHUB_SHA}. Review the PNG diff before merging: it becomes what
          every future run of the visual gate is judged against."
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(visual): re-bless the golden baseline" \
            --body "**Reason given:** $REASON

          Captured on \`ubuntu-latest\` at \`${GITHUB_SHA::7}\` by the \`visual-baseline-bless\` workflow.

          **Review the images, not the diff stat.** GitHub shows each PNG before/after in
          Files changed. Every future run of \`pnpm golden-baseline\` is judged against
          exactly these pixels, so a wrong picture merged here silently disarms the gate
          for everything it would otherwise have caught.

          If the change was not intended, close this PR and fix the renderer instead." \
            --head "$BRANCH" && exit 0

          # Only reachable when `gh pr create` failed. The branch is already
          # pushed at this point, so the work is NOT lost -- say so, and say
          # exactly how to finish, because the one failure seen here reads as
          # nothing of the sort:
          #
          #   pull request create failed: GraphQL: GitHub Actions is not
          #   permitted to create or approve pull requests (createPullRequest)
          #
          # That is a repository setting, not a token scope and not a bug in
          # this file: Settings -> Actions -> General -> Workflow permissions ->
          # "Allow GitHub Actions to create and approve pull requests". With it
          # off, every bless this workflow ever runs will get this far and stop,
          # having pushed a perfectly good baseline nobody is told about
          # (measured: run 33596042795, where the capture step succeeded in 62 s
          # and this step exited 1).
          echo "::error title=Baseline pushed, PR not opened::The branch $BRANCH is pushed with the new baseline, but gh pr create failed. See the step summary."
          {
            echo "### :warning: Baseline captured and pushed, but no PR was opened"
            echo ""
            echo "The new baseline is on branch \`$BRANCH\` — nothing is lost. Open the PR by hand:"
            echo ""
            echo "  https://github.com/${GITHUB_REPOSITORY}/pull/new/$BRANCH"
            echo ""
            echo "If the failure above says *\"GitHub Actions is not permitted to create or approve"
            echo "pull requests\"*, that is a repository setting rather than anything in this"
            echo "workflow: **Settings → Actions → General → Workflow permissions → Allow GitHub"
            echo "Actions to create and approve pull requests**. Until it is on, every bless will"
            echo "stop here."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
