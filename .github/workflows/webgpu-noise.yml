# GH-943 WebGPU-primary, P1 T1: the zero-noise check on each node key, MANUAL.
#
# 24 `quiet` captures per key, each in a FRESH PROCESS (a new dev server, browser and GPU device), must be byte-identical
# (`tools/src/ci/noise-check.ts`). It is the claim the parity job stands on: the node arms are deterministic, so a band's width belongs
# to its class and a ratio moves only when the code moves. Not on every PR: 24 boots per key is ~20 min of SwiftShader. Dispatch it from
# the Actions tab (or `gh workflow run webgpu-noise.yml --ref <branch>`) when a node-path PR changes what a capture draws. GitHub only
# offers a dispatch for a workflow file that is on the default branch, so it first becomes available when this file reaches main.
#
# GH-943 WebGPU P2 T2: `probe: banding` runs the banding probe (`tools/src/perf/webgpu-banding-probe.ts`) instead: ONE job, the L, wgl2
# and wgpu arms in sequence on SwiftShader, each hypothesis toggle read with `bandingIndex`, and the probe's JSON, table and crops
# uploaded. A diagnosis for T8, report-only: nothing reads its exit. It rides this file because a dispatch needs a workflow that is
# already on the default branch (`gh workflow run webgpu-noise.yml --ref <branch> -f probe=banding`).
#
# GH-943 WebGPU P3 T2: `probe: units` and `probe: fx` run the units/fx probe (`tools/src/perf/webgpu-units-probe.ts`) the same way: ONE job,
# the plain-legacy, legacy-matched, wgl2 and wgpu readings in sequence on SwiftShader, its JSON, table and frames uploaded. The parity
# method's ungated rows (plan, "Parity method"): every later P3 port appends a subject to it and flips its node side live.
#
# GH-943 WebGPU P3 T13 (GH-1152): `probe: submit` runs the draw-submission probe (`tools/src/perf/webgpu-submit-probe.ts`) with
# `--hw=swiftshader`: the COUNTS only (per-pass calls/objects, per-type draws, FULL refreshes per type, every hypothesis toggle at n300
# and n600 on L and G, one profile window on G). Its timing is the Metal lock hold's, never SwiftShader's.
#
# GH-1167 S6: `probe: grass` runs the 3D grass probe (`tools/src/perf/webgpu-grass-probe.ts`) with SwiftShader: the G arm on wadi_halam_4 with the
# green tones, the `grass-field` layer shown against hidden at z0.5, z1, z1.5 and z2.5, `stats().perPass` calls and triangles each way. COUNTS
# only and report-only, except that it REFUSES (exit 2) a grass-on arm that drew 0 grass calls, so it cannot pass vacuously.
name: webgpu-noise

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Fresh-process captures per key
        default: '24'
      probe:
        description: noise (the zero-noise check), banding (the P2 T2 banding probe), units / fx (the P3 T2 units/fx probe), submit (the P3 T13 draw-submission counts), or grass (the GH-1167 S6 3D grass counts, G on against off)
        default: noise

permissions:
  contents: read

jobs:
  noise:
    if: inputs.probe != 'banding' && inputs.probe != 'units' && inputs.probe != 'fx' && inputs.probe != 'submit' && inputs.probe != 'grass'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arm: [webgl2, webgpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      - name: Fresh-process captures
        run: |
          set +e
          pnpm --filter @lions/tools exec tsx src/ci/noise-check.ts --gpu=${{ matrix.arm }} --scenario=quiet --runs=${{ inputs.runs }} --port=5186 2>&1 | tee noise-check.log
          code=${PIPESTATUS[0]}
          {
            echo "### webgpu-noise / ${{ matrix.arm }}: exit \`$code\` (0 identical, 1 differ, 2 a process failed)"
            echo '```'
            grep -E "PASS|FAIL|process" noise-check.log | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-noise-${{ matrix.arm }}
          path: |
            noise-check-output
            noise-check.log
          if-no-files-found: ignore
          retention-days: 3

  banding:
    if: inputs.probe == 'banding'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      - name: Banding probe (L, wgl2, wgpu on SwiftShader)
        run: |
          set +e
          pnpm --filter @lions/tools exec tsx src/perf/webgpu-banding-probe.ts --hw=swiftshader --arms=L,F,G --port=5186 --out-dir="$GITHUB_WORKSPACE/banding-probe" 2>&1 | tee banding-probe.log
          code=${PIPESTATUS[0]}
          {
            echo "### webgpu banding probe (SwiftShader): exit \`$code\` (0 read, 2 refused)"
            cat "$GITHUB_WORKSPACE/banding-probe/banding-probe.md" 2>/dev/null || tail -40 banding-probe.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-banding-probe
          path: |
            banding-probe
            banding-probe.log
          if-no-files-found: ignore
          retention-days: 14

  units-fx:
    if: inputs.probe == 'units' || inputs.probe == 'fx'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      - name: Units/fx probe (L plain, L matched, wgl2, wgpu on SwiftShader)
        run: |
          set +e
          pnpm --filter @lions/tools exec tsx src/perf/webgpu-units-probe.ts --kind=${{ inputs.probe }} --hw=swiftshader --arms=L,F,G --port=5194 --out-dir="$GITHUB_WORKSPACE/units-probe" 2>&1 | tee units-probe.log
          code=${PIPESTATUS[0]}
          {
            echo "### webgpu ${{ inputs.probe }} probe (SwiftShader): exit \`$code\` (0 read, 2 refused)"
            cat "$GITHUB_WORKSPACE/units-probe/${{ inputs.probe }}-probe.md" 2>/dev/null || tail -40 units-probe.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-${{ inputs.probe }}-probe
          path: |
            units-probe
            units-probe.log
          if-no-files-found: ignore
          retention-days: 14

  submit:
    if: inputs.probe == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      - name: Submit probe (counts only, L and wgpu on SwiftShader)
        run: |
          set +e
          pnpm --filter @lions/tools exec tsx src/perf/webgpu-submit-probe.ts --hw=swiftshader --arms=L,G --port=5197 --out-dir="$GITHUB_WORKSPACE/submit-probe" 2>&1 | tee submit-probe.log
          code=${PIPESTATUS[0]}
          {
            echo "### webgpu submit probe (SwiftShader, counts only): exit \`$code\` (0 read, 2 refused)"
            cat "$GITHUB_WORKSPACE/submit-probe/submit-probe.md" 2>/dev/null || tail -40 submit-probe.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-submit-probe
          path: |
            submit-probe
            submit-probe.log
          if-no-files-found: ignore
          retention-days: 14

  grass:
    if: inputs.probe == 'grass'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      - name: Grass probe (G on SwiftShader, layer shown against hidden, counts only)
        run: |
          set +e
          pnpm --filter @lions/tools exec tsx src/perf/webgpu-grass-probe.ts --port=5199 --out-dir="$GITHUB_WORKSPACE/grass-probe" 2>&1 | tee grass-probe.log
          code=${PIPESTATUS[0]}
          {
            echo "### webgpu grass probe (SwiftShader, counts only): exit \`$code\` (0 read, 2 refused)"
            cat "$GITHUB_WORKSPACE/grass-probe/grass-probe.md" 2>/dev/null || tail -40 grass-probe.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgpu-grass-probe
          path: |
            grass-probe
            grass-probe.log
          if-no-files-found: ignore
          retention-days: 14
