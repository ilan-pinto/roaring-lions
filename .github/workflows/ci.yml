# All the repo's gates, exactly as contributors run them locally.
# The determinism job is the interesting one: the same 1000-tick replay must
# produce the same golden state hash on Linux, macOS, and Windows — that is
# invariants 2 and 3 made falsifiable.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:data
      - run: pnpm validate:assets
      # Phase G (docs/superpowers/specs/2026-08-26-three-renderer-design.md):
      # validate:assets never looks at art/meshes/ -- it walks PNGs, and a mesh
      # produces none. tools/validate_mesh_assets.py renders every mesh headlessly
      # (tools/render_mesh_gate.py, inside this Blender) at the locked dimetric
      # angle and runs the SAME palette/framing/fill/silhouette-IoU checks
      # validate_assets.py already runs on sprites. A sibling script and gate step,
      # not folded into validate:assets itself, so a contributor with no Blender
      # installed can still run the fast, PNG-only sprite gate locally unblocked.
      # Version pinned to match the Blender.app used for local dev (CLAUDE.md,
      # "Blender 5.2.0 LTS"), same reasoning render_rig.py's rig-lock comment
      # gives for every other CI-vs-local mismatch risk in this pipeline.
      - name: Install Blender (mesh gate)
        run: |
          curl -fsSL -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender
          tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          echo "/opt/blender" >> "$GITHUB_PATH"
      - run: pnpm validate:meshes
      - run: pnpm validate:ui
      - run: pnpm validate:audio
      - run: python tools/validate_balance.py --units data/units
      - run: pnpm balance
      # Headless mission playtests (tools/src/backtest/playtest.ts): each Beit Sahwan/
      # Wadi Halam mission must be winnable by a sensible scripted plan inside its time
      # budget. This was a manual `npx tsx` script, wired into neither `pnpm test` nor
      # CI, and it crashed on every mission from Beit Sahwan II onward for days after
      # d46b926 landed -- fixed at b604032, but nothing caught the break itself because
      # nothing ran this gate (CLAUDE.md's "Known scaling debts"). No sim/browser/GPU
      # involved and it finishes in ~3s, so -- unlike the golden-diff gate in its own
      # workflow -- it costs nothing to run on every push rather than being gated
      # behind a schedule or a label.
      - run: pnpm playtest
      # Sim-side half of the three-vs-Pixi scaling claim (tools/src/perf/three-units.ts):
      # no browser/GPU involved, so it can run headless here exactly like `pnpm balance`
      # above it. Fails the build if sim.tick() cost regresses past a generous budget at
      # 65/150/300/400 units -- see that file's Node-CLI section for what this does and
      # does not cover (render cost stays a manual browser gate).
      - run: pnpm perf:units
      - run: pnpm build

  # The visual regression gate: three.js against a committed three.js baseline
  # (tools/src/ci/three-baseline-gate.ts). Its own job rather than a step in
  # `gates` because it needs Playwright's Chromium (~270 MB, cached) and a real
  # Vite dev server, and because a separate job runs in PARALLEL -- `gates`
  # already spends several minutes on Blender, balance, playtest and build, so
  # this adds runner minutes and no wall-clock to the pipeline.
  #
  # ON EVERY PR AND EVERY PUSH TO MAIN, deliberately, and that is the whole
  # lesson of what it replaces. The old cross-backend golden-diff ran nightly
  # and on an opt-in label only; it went red and stayed red through 124 commits
  # because nothing put a tick in front of the person making the change
  # (.superpowers/queue/golden-diff-red-report.md). Measured cost of being here:
  # 30.8s wall clock for all four scenarios end to end, INCLUDING booting its
  # own dev server, on an M3 Pro through software SwiftShader -- the same
  # rasteriser this runner uses, so the figure travels.
  #
  # No `paths:` filter. A palette entry, a piece of map data, a GLB or a mission
  # can all change what is on screen without touching packages/render, and a
  # path list that has to enumerate them is a list that goes stale silently --
  # the SPRITE_MAP failure mode this repo already knows.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @lions/tools exec playwright install --with-deps chromium
      # Exit 3 is "no baseline blessed for this capture environment yet" -- a
      # distinct code precisely so it can be told apart from "the picture
      # changed" (exit 1). It warns rather than failing, so a fork or a
      # brand-new runner is not blocked by a picture nobody has approved.
      #
      # THAT LENIENCY IS ONLY DEFENSIBLE BECAUSE TWO THINGS ARE NOW TRUE, and
      # neither was when it was written. The `visual-baseline-bless` workflow
      # could not create a first baseline at all -- its `git diff --quiet`
      # guard is blind to untracked files, so the very run that writes a new
      # environment directory reported "unchanged" and opened no PR -- which
      # made exit 3 permanent and this job a green tick forever. And the gate
      # returned before capturing anything on exit 3, so not even the
      # reference-free self-check ran. Both are fixed; a self-check failure now
      # exits 1 even with no baseline.
      #
      # WHAT AN UNBLESSED RUNNER ACTUALLY JUDGES, measured 2026-09-03: the ten
      # visible-toggle checks (hide a draw layer, repaint, capture, require the
      # frame to change) across quiet, open-ground and relief. Both defects
      # this gate has been broken with exit 1 from that state -- the decor
      # erase drives the `decor` toggle to 0 px / 0.0000, and the stone-grain
      # scatter no-op fails the `scatter` tone ratio at 0.5927-0.6938 against a
      # 0.8 floor. The decor erase is the one that used to reach exit 3 here
      # and turn a four-scenario red into a green tick.
      #
      # THAT IS STILL NOT "a real defect always fails here". `vehicle` and
      # `combat` declare no reference-free check at all, and every check that
      # runs names ONE layer in ONE framing -- a regression in unit meshes,
      # fog, overlays or a wrong-but-still-present colour passes at any size.
      # The warning below remains the safety net until a baseline is blessed
      # for this runner, which is the action it asks for.
      #
      # The warning is also written to the step summary. A `::warning::`
      # annotation is easy to miss beside a green tick, and "the gate told you
      # it was doing nothing and you did not see it" is the same failure as the
      # gate not telling you.
      - name: three-vs-three against the committed baseline
        run: |
          set +e
          pnpm golden-baseline -- --port=5175 --out-dir=visual-baseline-output
          code=$?
          if [ "$code" = "3" ]; then
            echo "::warning title=No visual baseline for this runner::This gate compared NOTHING. Run the visual-baseline-bless workflow to create a baseline for this runner."
            {
              echo "### :warning: Visual gate compared nothing"
              echo ""
              echo "There is no committed baseline for this runner's capture environment, so"
              echo "\`pnpm golden-baseline\` captured every scenario and compared none of them."
              echo ""
              echo "Only \`open-ground\` carries a reference-free self-check, so that one 450x400"
              echo "ground crop is everything this run judged. A measured example of what walks"
              echo "past it: erasing every decor object fails all four gated scenarios against a"
              echo "baseline (relief 37183 px / 2.7229) and exits 3 here."
              echo ""
              echo "Fix: run the **visual-baseline-bless** workflow; it commits the baseline straight to main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
      # Uploaded on failure AND on success: the diff image is what a triager
      # actually needs, and `combat` is captured but never gated, so its frame
      # is only ever reachable here.
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-output
          path: visual-baseline-output
          if-no-files-found: ignore
          retention-days: 14

  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:determinism

  # Cuts a version from the commits since the last tag, but only for a commit
  # that already passed every gate on all three platforms — `needs` is what
  # makes that true. A version that cannot survive the determinism matrix is
  # not a version anyone should be able to point at.
  #
  # The rule lives in tools/next_version.mjs and is tested: any feat is a
  # minor, any fix is a patch, and docs/test/refactor alone cut NOTHING. That
  # last case is the common one here — a spec, a plan and a ledger correction
  # are a normal merge, and they change nothing a player can see.
  version:
    needs: [gates, visual, determinism]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # contents to push the bump and the tag; actions to dispatch pages
      # afterwards. Without the second the final step fails with a 403 that
      # reads as a broken build when the release itself already landed.
      contents: write
      actions: write
    steps:
      # The whole history and every tag: the rule reads the range since the
      # last release, which a shallow clone cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: decide
        name: Decide the next version
        run: node tools/decide_version.mjs >> "$GITHUB_OUTPUT"

      # Everything below is skipped when the range holds no feat and no fix.
      - name: Write, commit and tag
        if: steps.decide.outputs.next != ''
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const p = "package.json";
            const raw = fs.readFileSync(p, "utf8");
            // Rewrite the one line rather than reserialising: JSON.stringify
            // would reorder nothing but would reformat everything, and this
            // file is hand-maintained.
            const out = raw.replace(/^(\s*"version":\s*")[^"]+(")/m, `$1${process.env.NEXT}$2`);
            if (out === raw) throw new Error("version line not found in package.json");
            fs.writeFileSync(p, out);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # [skip ci] is what stops this push retriggering ci and pages. Without
          # it the bump would trigger a run that finds no new commits since the
          # tag, cuts nothing, and still costs a full matrix.
          git commit -m "chore(release): v${NEXT} [skip ci]"
          # ANNOTATED, and pushed by name. --follow-tags ignores lightweight
          # tags, so the first live run pushed the bump commit and silently
          # dropped the tag — which matters more than it sounds: the rule
          # reads "commits since the last tag", so a missing tag makes the
          # next merge rescan the whole history and bump again, forever.
          git tag -a "v${NEXT}" -m "v${NEXT}"
          git push origin HEAD:main
          git push origin "refs/tags/v${NEXT}"

      # The push above is invisible to Actions, so the Pages deploy running
      # for the merge that triggered this job would publish the PRE-bump
      # version. Dispatching it again is what keeps the number the app shows
      # in step with the tag that was just cut.
      - name: Redeploy Pages at the new version
        if: steps.decide.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
