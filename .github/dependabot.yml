# Weekly dependency updates. Dev dependencies arrive as ONE pull request and
# runtime dependencies (three, the workspace packages' own deps) as another,
# so a week of churn is two reviews, not twenty.
#
# Commit-message prefixes feed tools/next_version.mjs: `chore` moves no
# version (a dev-tooling bump must not cut a release), `fix` is a patch (a
# runtime bump changes what ships). Neither is `feat`, so none reaches the
# displayed major.minor.
#
# Also on, in repository settings (not configurable here): Dependabot alerts
# and Dependabot security updates.
version: 2
updates:
  - package-ecosystem: npm
    # The pnpm workspace root; Dependabot reads pnpm-workspace.yaml and
    # pnpm-lock.yaml and covers every package under it.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # Major versions are upgrades, not updates: TypeScript, eslint, vite,
      # vitest and friends each change behaviour at a major, and a grouped
      # weekly PR full of them only goes red (first run, 2026-10-13: #568).
      # Majors are taken deliberately, one tool at a time, in their own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # three is 0.x, so every MINOR is a breaking release (r170 -> r186 in
      # #569 failed gates, visual and memory). The renderer rules in CLAUDE.md
      # cite r170 behaviour by name; upgrading three is its own planned task.
      - dependency-name: three
        update-types: ["version-update:semver-minor"]
      # jsdom is pinned to ~30.0.1 (security review #559): 30.1 and later
      # break vitest 4's fake setImmediate. Vitest 5 does not fix it (#574
      # step 2, measured: the same two audio.test.ts dispose specs count
      # jsdom's own media timers, and net-chat.test.ts's Escape spec keeps
      # focus on a hidden input). Lift this when both are fixed.
      - dependency-name: jsdom
        versions: [">=30.1.0"]
    # The postcss override that stood in pnpm-workspace.yaml is gone: vite 8
    # requires postcss ^8.5.29 itself (#574 step 2).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    # Actions are pinned by SHA with a version comment (#562); Dependabot
    # rewrites both together, keeping the pins current.
    groups:
      github-actions:
        patterns: ["*"]
